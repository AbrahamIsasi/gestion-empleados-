<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="paginator">
    <ul class="pagination">

        <!-- Primera -->
        <li class="page-item" th:class="${page.first? 'page-item disabled' : 'page-item'}">
            <span class="page-link" th:if="${page.first}">Primera</span>
            <a class="page-link" th:if="${not page.first}"
               th:href="@{${page.url}(page=0, sede=${sedeSeleccionada}, supervisor=${supervisorSeleccionado})}">
                Primera
            </a>
        </li>

        <!-- Anterior -->
        <li class="page-item" th:class="${not page.hasPrevius? 'page-item disabled': 'page-item'}">
            <span class="page-link" th:if="${not page.hasPrevius}">&laquo;</span>
            <a class="page-link" th:if="${page.hasPrevius}"
               th:href="@{${page.url}(page=${page.paginaActual - 2}, sede=${sedeSeleccionada}, supervisor=${supervisorSeleccionado})}">
                &laquo;
            </a>
        </li>

        <!-- Números -->
        <li class="page-item"
            th:each="item : ${page.paginas}"
            th:class="${item.actual? 'page-item active': 'page-item'}">

        <span class="page-link"
              th:if="${item.actual}"
              th:text="${item.numero}"></span>

            <a class="page-link"
               th:if="${not item.actual}"
               th:href="@{${page.url}(page=${item.numero-1}, sede=${sedeSeleccionada}, supervisor=${supervisorSeleccionado})}"
               th:text="${item.numero}">
            </a>
        </li>

        <!-- Siguiente -->
        <li class="page-item" th:class="${not page.hasNext? 'page-item disabled': 'page-item'}">
            <span class="page-link" th:if="${not page.hasNext}">&raquo;</span>
            <a class="page-link" th:if="${page.hasNext}"
               th:href="@{${page.url}(page=${page.paginaActual}, sede=${sedeSeleccionada}, supervisor=${supervisorSeleccionado})}">
                &raquo;
            </a>
        </li>

        <!-- Última -->
        <li class="page-item" th:class="${page.last? 'page-item disabled' : 'page-item'}">
            <span class="page-link" th:if="${page.last}">Última</span>
            <a class="page-link" th:if="${not page.last}"
               th:href="@{${page.url}(page=${page.totalPaginas - 1}, sede=${sedeSeleccionada}, supervisor=${supervisorSeleccionado})}">
                Última
            </a>
        </li>

    </ul>
</nav>

</body>
</html>
