<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/layout :: head">
    <meta charset="utf-8">
</head>
<body>

<header th:replace="layout/layout :: header"></header>

<br>

<div class="container">
    <div class="row">
        <div class="col-lg-6 col-md-6 col-sm-6 container justify-content-center card">

            <h1 class="text-center" th:text="${titulo}"></h1>

            <div class="card-body">

                <form th:action="@{/form}" th:object="${empleado}" method="post">

                    <!-- ID OCULTO -->
                    <input type="hidden" th:field="*{id}"/>


                     <!-- 🟢 SEDE OCULTA (IMPORTANTE PARA GUARDAR CORRECTAMENTE) -->
                    <input type="hidden" name="sede"
                           th:value="${empleado.sede != null ? empleado.sede.idSede : sedeSeleccionada}" />


                    <!-- CAMPOS BÁSICOS -->
                    <div class="form-group">
                        <label>Nombre Completo:</label>
                        <input type="text" th:field="*{nombreCompleto}" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Nombre Corto (1er nombre y 1er apellido):</label>
                        <input type="text" th:field="*{nombreCorto}" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" th:field="*{email}" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Fecha Ingreso:</label>
                        <input type="date" th:field="*{fecha}" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Cargo:</label>
                        <select th:field="*{cargo}" class="form-control"required>
                            <option value="JEFE DE OPERACIONES">JEFE DE OPERACIONES</option>
                            <option value="SUPERVISOR DE VENTAS">SUPERVISOR DE VENTAS</option>
                            <option value="TEAM LIDER">TEAM LIDER</option>
                            <option value="FORMADOR DE VENTAS">FORMADOR DE VENTAS</option>
                            <option value="SUPERVISOR LL">SUPERVISOR LL</option>
                            <option value="AGENTE DE VENTAS">AGENTE DE VENTAS</option>
                            <option value="SUPERVISOR DE BO">SUPERVISOR DE BO</option>
                            <option value="ANALISTA DE CALIDAD">ANALISTA DE CALIDAD</option>
                            <option value="MONITOR DE CALIDAD">MONITOR DE CALIDAD</option>
                            <option value="VALIDADOR DE VENTAS">VALIDADOR DE VENTAS</option>
                            <option value="FIDELIZADOR DE VENTAS">FIDELIZADOR DE VENTAS</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Teléfono:</label>
                        <input type="number" th:field="*{telefono}" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Sexo:</label>
                        <select th:field="*{sexo}" class="form-control"required>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Dni:</label>
                        <input type="number" th:field="*{dni}" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Estado del Empleado:</label>
                        <select th:field="*{tipoEstado}" class="form-control" required>
                            <option th:value="true"  th:selected="${empleado.tipoEstado == true}">Activo</option>
                            <option th:value="false" th:selected="${empleado.tipoEstado == false}">Baja</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label>Condición:</label>
                        <select th:field="*{condicion}" class="form-control"required>
                            <option value="PRELIMINAR">Preliminar</option>
                            <option value="RXH">RxH</option>
                            <option value="PLANILLA">Planilla</option>
                        </select>
                    </div>

                    <!-- SUPERVISOR -->
                    <div class="form-group">
                        <label>Supervisor:</label>
                        <select th:field="*{supervisor.idSupervisor}" class="form-control" required>
                            <option value="">-- Seleccione supervisor --</option>
                            <option th:each="s : ${supervisores}"
                                    th:value="${s.idSupervisor}"
                                    th:text="${s.nombre}"
                                    th:selected="${empleado.supervisor != null and s.idSupervisor == empleado.supervisor.idSupervisor}">
                            </option>
                        </select>
                    </div>

                    <div class="mt-3">
                        <input type="submit" value="Guardar" class="btn btn-primary">
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<footer th:replace="layout/layout :: footer"></footer>
</body>
</html>
